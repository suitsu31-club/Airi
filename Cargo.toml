[workspace]
resolver = "3"
members = [
    "bin/app-server",
    "bin/manage-tool",
    "lib/app_protobuf",
    "modules/auth",
    "modules/base",
    "modules/messaging"
]

[workspace.package]
version = "0.1.0-alpha"
authors = []
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Runtime
tokio = { version = "1.49", features = ["full"] }

# Framework
wakuwaku = { version = "0.2", features = ["tracing-otel", "tonic", "sqlx"] }
kanau = { version = "0.5", features = [
    "message",
    "rkyv",
    "bincode",
    "serde_json",
] }
amqprs = { version = "2.1", features = ["uriparse", "urispec"] }
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "time",
    "derive",
    "macros",
    "uuid",
    "rust_decimal",
    "json",
    "ipnetwork",
] }
redis = { version = "1.0", features = ["tokio-comp", "uuid", "json"] }
axum = { version = "0.8", features = ["macros", "form"] }
tower = "0.5"
http = "1"

# gRPC
tonic-prost-build = "0.14"
tonic = { version = "0.14", features = ["router", "server"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"

# Serialization & Deserialization
rkyv = { version = "0.8", features = ["uuid-1", "bytecheck"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1.19"
bytes = "1.10"
fast32 = "1.0.3"
bincode = { version = "2.0.1", features = ["serde"] }
urlencoding = "2.1"

# Data types
uuid = { version = "1.10", features = ["serde", "v4", "v7"] }
rust_decimal = { version = "1.37" }
compact_str = { version = "0.9.0", features = [
    "serde",
    "sqlx-postgres",
    "bytes",
    "smallvec",
] }
time = { version = "0.3", features = ["serde", "serde-human-readable"] }
url = { version = "2.5", features = ["serde"] }
smallvec = { version = "1.14.0", features = [
    "serde",
    "union",
    "const_generics",
    "const_new",
] }

# External tools
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "zstd", "deflate"] }
clap = { version = "4.5", features = ["derive", "env"] }

# Auth & Security
rand = "0.9.1"
validator = "0.20.0"
jsonwebtoken = "9.2.0"
sha2 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }

# OpenTelemetry
opentelemetry = { version = "0.31", features = ["metrics", "trace"] }
opentelemetry_sdk = { version = "0.31", features = ["metrics"] }
opentelemetry-otlp = { version = "0.31", features = ["trace", "metrics", "logs", "grpc-tonic"] }
tracing-opentelemetry = { version = "0.32", features = ["metrics"] }
opentelemetry-appender-tracing = "0.31"

# Tracing
tracing = "0.1"

# Algorithm
itertools = "0.14"

# Password hashing
argon2 = "0.5"

# Email
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder"] }
askama = "0.12"

# Error handling
anyhow = "1"
thiserror = "2"
futures = "0.3"

# Logging subscriber (binaries)
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.dev.package.sqlx-macros]
opt-level = 3
