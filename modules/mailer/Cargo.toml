[package]
name = "mailer"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[features]
# `MailDeliveryService` and its hook: the SMTP transport. Off by default, so
# modules that only call `SendEmail` don't build `lettre`.
delivery = ["dep:lettre"]

[dependencies]
# Internal
app_protobuf = { path = "../../lib/app_protobuf" }
base = { path = "../base" }
type_safe_data = {path = "../../lib/type_safe_data"}

# Framework
wakuwaku = { workspace = true }
kanau = { workspace = true }
tokio = { workspace = true }

# Persistence
sqlx = { workspace = true }
redis = { workspace = true }

# Errors
thiserror = { workspace = true }
anyhow = { workspace = true }

# gRPC / transport
tonic = { workspace = true }
tonic-prost = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }

# Serialization
rkyv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }

# Data types
uuid = { workspace = true }
time = { workspace = true }
rust_decimal = { workspace = true }
compact_str = { workspace = true }
smallvec = { workspace = true }

# Tracing
tracing = { workspace = true }

# Algorithm
itertools = { workspace = true }
blake3 = { workspace = true }

# Secrets
base64 = { workspace = true }
zeroize = { workspace = true }

# SMTP (feature `delivery`)
lettre = { workspace = true, optional = true }

[dev-dependencies]
# The mail catcher's HTTP API, in `tests/delivery.rs`.
reqwest = { workspace = true }
